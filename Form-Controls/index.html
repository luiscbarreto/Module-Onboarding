<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>My form exercise</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <header>
      <h1>Product Pick</h1>
    </header>
    <main>
      <form>
        <!--What is the customer's name? I must collect this data,
         and validate it. But what is a valid name? I must decide something.
         
         What is the customer's email? I must make sure the email is valid.
         Email addresses have a consistent pattern.
         
         What colour should this t-shirt be? I must give 3 options. 
         How will I make sure they don't pick other colours?
         
         What size does the customer want?
         I must give the following 6 options: XS, S, M, L, XL, XXL
         -->
          <div>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" placeholder="Jane Doe" minlength="2" required> 
          </div>  

          <div>
            <label for="email">Email Adress:</label>
            <input type="email" id="email" name="email" placeholder="example@mail.com" required>
          </div>

          <div>
            <p>What colour should this t-shirt be?</p>
              <div>
                <input type="radio" id="black" name="color" value="black" required>
                <label for="red">Black</label>
                <input type="radio" id="white" name="color" value="white" required>
                <label for="red">White</label>
                <input type="radio" id="pink" name="color" value="pink" required>
                <label for="red">Pink</label>
              </div>  
          </div>

        <div>
          <p>What size does the customer want?</p>
            <select id="size" name="size" required>
              <option value="xs">XS</option>
              <option value="s">S</option>
              <option value="m">M</option>
              <option value="l">L</option>
              <option value="xl">XL</option>
              <option value="xxl">XXL</option>
            </select>           
        </div>

      </form>
    </main>
    <footer>
      <!-- change to your name-->
      <h2>By HOMEWORK SOLUTION</h2>
    </footer>
  </body>
</html>
