<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>My form exercise</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <header>
      <h1>Product Pick</h1>
    </header>
    <main>
      <form>
          <fieldset>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" placeholder="Jane Doe" minlength="2" required> 
          </fieldset>  

          <fieldset>
            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" placeholder="example@mail.com" required>
          </fieldset>

          <fieldset>
            <legend>What colour should this t-shirt be?</legend>
              <div>
                <label for="black">Black</label>
                <input type="radio" id="black" name="color" value="black" required>
                <label for="white">White</label>
                <input type="radio" id="white" name="color" value="white" required>
                <label for="pink">Pink</label>
                <input type="radio" id="pink" name="color" value="pink" required>
              </div>  
          </fieldset>

        <fieldset>
          <label for="size">What size does the customer want?</label>
            <select id="size" name="size" required>
              <option value="xs">XS</option>
              <option value="s">S</option>
              <option value="m">M</option>
              <option value="l">L</option>
              <option value="xl">XL</option>
              <option value="xxl">XXL</option>
            </select>           
        </fieldset>
        
        <button>Submit</button>  
      </form>
    </main>
    <footer>
      <h2>By LUIS BARRETO</h2>
    </footer>
  </body>
</html>
